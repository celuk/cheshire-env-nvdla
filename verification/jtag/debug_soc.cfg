adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb

transport select jtag
adapter speed 50

jtag newtap riscv_fpga tap -irlen 6 -expected-id 0x23731093

jtag newtap zynq_ps tap -irlen 4 -expected-id 0x4ba00477

target create riscv.cpu riscv -chain-position riscv_fpga.tap

riscv use_bscan_tunnel 2

gdb port 3333
telnet port 4444
